[project]
name = "frogshorts"
version = "0.1.0"
description = "참고 쇼츠 URL 하나로 우리 가게 버전 쇼츠를 만드는 도구"
requires-python = ">=3.11"
dependencies = ["pyyaml>=6", "pillow>=10", "tzdata; sys_platform == 'win32'"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
frogshorts = "frogshorts.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["frogshorts*"]

[tool.setuptools.package-data]
frogshorts = ["parts/*.html", "parts/*.js", "parts/fonts/*", "parts/vendor/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
